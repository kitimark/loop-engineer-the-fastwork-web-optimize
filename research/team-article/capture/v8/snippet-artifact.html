  <figcaption id="ba-cap">Left, the original page (the frozen copy we measure against); right, v8. Both ran in Chrome on the Mac, emulating the iPhone's screen (430×932, touch) with the page's main thread slowed 6×. That is the setting that reproduces the phone's scripted-scroll stutter counts. Both sides got the same script, 3 runs each, and each clip shows that side's middle run (by its slow-frame count); both clocks start at the first input, so where one side freezes, that page drew no new frame. The strip under each clip is that run's frame times: a bar's width is how long the frame took. This is an illustration, not a measurement. The screen capture costs work on both sides, and the numbers in this article come from repeated A/B runs. It can't show a finger on the glass, how the phone really feels, or costs that only Safari has. Several v8 changes only act in Safari (the hero's CSS mode, the animations Safari runs on its scroll thread), so Chrome understates them. Captured 2026-10-05, baseline snapshot b1789284481295-4ad4a84a.</figcaption>
