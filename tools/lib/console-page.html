<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User console</title>
<link rel="stylesheet" href="/console-nav.css">
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
  --accent: #2f5bd3; --accent-ink: #ffffff; --accent-soft: #e8eefc;
  --ok: #23824a; --ok-soft: #e4f3ea; --rec: #c62f2f; --rec-soft: #fbe9e7; --warn-soft: #fdf3dc;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161716; --card: #202221; --ink: #ecebe6; --muted: #9b9a93; --line: #34362f;
    --accent: #7c9bff; --accent-ink: #0f1424; --accent-soft: #232b45;
    --ok: #5cc68a; --ok-soft: #1d3326; --rec: #ff6b6b; --rec-soft: #3a2020; --warn-soft: #3a3220;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161716; --card: #202221; --ink: #ecebe6; --muted: #9b9a93; --line: #34362f;
  --accent: #7c9bff; --accent-ink: #0f1424; --accent-soft: #232b45;
  --ok: #5cc68a; --ok-soft: #1d3326; --rec: #ff6b6b; --rec-soft: #3a2020; --warn-soft: #3a3220;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 80px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
header h1 { font-size: 22px; margin: 0; font-weight: 650; }
header .sub { color: var(--muted); font-size: 15px; flex: 1 1 240px; }
.pill { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.status { font-size: 13px; color: var(--muted); }
.status.off { color: var(--rec); font-weight: 600; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 18px; min-height: 48px; }
button:disabled { cursor: not-allowed; opacity: .5; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
button.big { font-size: 20px; min-height: 64px; padding: 14px 28px; min-width: 180px; }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); min-height: 40px; padding: 6px 10px; }
button.quiet:hover { color: var(--ink); text-decoration: underline; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 14px; margin-bottom: 18px; box-shadow: var(--shadow); }
.card.first { border: 2px solid var(--accent); }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 14px; }
.card h2 { font-size: 22px; margin: 8px 0 6px; line-height: 1.3; }
.instr { margin: 0 0 12px; white-space: pre-wrap; }
.url { font-size: 15px; word-break: break-all; margin: 0 0 12px; }
.url a { color: var(--accent); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; padding: 0; list-style: none; }
.steps li { font-size: 14px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.steps li.now { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.steps li.did { color: var(--ok); border-color: transparent; background: var(--ok-soft); }
.panel { border-radius: 14px; padding: 18px; background: var(--bg); margin-bottom: 10px; }
.panel h3 { margin: 0 0 6px; font-size: 18px; }
.panel p { margin: 0 0 12px; }
.panel.rec { background: var(--rec-soft); }
.panel.wait { background: var(--warn-soft); }
.recline { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; color: var(--rec); margin-bottom: 12px; }
.dot { width: 18px; height: 18px; border-radius: 50%; background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .dot, .spin { animation: none; } }
@keyframes pulse { 50% { opacity: .25; } }
.timer { font-variant-numeric: tabular-nums; }
.spin { display: inline-block; width: 16px; height: 16px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .9s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes rot { to { transform: rotate(360deg); } }
.ends { font-weight: 600; }
.msg { font-size: 15px; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); margin: 0 0 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 12px; }
.opts button { font-size: 22px; min-height: 72px; font-weight: 650; }
.scale { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.scale button { min-width: 56px; font-size: 18px; }
.scale button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-height: 56px; resize: vertical; margin-bottom: 12px; }
label.small { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.foot { display: flex; justify-content: flex-end; margin-top: 4px; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; border: 2px dashed var(--line); border-radius: 18px; }
.empty b { display: block; color: var(--ink); font-size: 20px; margin-bottom: 4px; }
h2.section { font-size: 16px; color: var(--muted); font-weight: 600; margin: 36px 0 10px; }
.done-list { list-style: none; margin: 0; padding: 0; }
.done-list li { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.done-list .ans { font-weight: 650; }
.done-list .t { flex: 1 1 260px; }
.done-list .who, .done-list .when { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<!--console-menu-->
<div class="wrap">
  <header>
    <h1>Your steps</h1>
    <span class="sub">What the agents need from you, oldest first. Click Start when you are ready.</span>
    <span id="conn" class="status">connecting…</span>
  </header>
  <main id="open"></main>
  <h2 class="section" id="done-h" hidden>Finished</h2>
  <ul class="done-list" id="done"></ul>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/console-nav.js"></script>
<script>
'use strict';
var steps = [], sig = '', skew = 0, drafts = {}, pending = false, hashDone = false, confirmOver = {};
// the top bar, badge, theme and notifications: /console-nav.js (shared with /progress)

// ---- tiny DOM helper ----
function el(tag, attrs) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === undefined || c === null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
function now() { return Date.now() + skew; }
function ago(iso) {
  var s = Math.max(0, Math.round((now() - Date.parse(iso)) / 1000));
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return new Date(iso).toLocaleString();
}
function clock(iso) {
  var s = Math.max(0, Math.floor((now() - Date.parse(iso)) / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function toast(t) {
  var x = document.getElementById('toast');
  x.textContent = t; x.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(function () { x.hidden = true; }, 6000);
}

// ---- server ----
function load() {
  return fetch('/api/steps', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    skew = Date.parse(j.now) - Date.now();
    var c = document.getElementById('conn'); c.textContent = 'live'; c.className = 'status';
    var s = j.steps.map(function (x) { return x.id + ':' + x.rev; }).join(',');
    if (s !== sig) { sig = s; steps = j.steps; render(); }
  }).catch(function () {
    var c = document.getElementById('conn'); c.textContent = 'not connected: is console.mjs serve running?'; c.className = 'status off';
  });
}
function act(id, action, body, btn) {
  if (pending) return;
  pending = true;
  if (btn) btn.disabled = true;
  fetch('/api/steps/' + id + '/' + action, { method: 'POST', headers: { 'content-type': 'application/json', 'x-console': '1' }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) toast(j.error || ('HTTP ' + r.status)); }); })
    .catch(function (e) { toast('Could not reach the console server: ' + e.message); })
    .then(function () { pending = false; if (body && body.notes !== undefined) delete drafts[id]; sig = ''; return load(); });
}

// ---- rendering ----
function notesBox(s, label) {
  var t = el('textarea', { placeholder: 'Optional notes', 'aria-label': label || 'Notes', oninput: function () { drafts[s.id] = t.value; } });
  t.value = drafts[s.id] || '';
  return el('div', null, el('label', { class: 'small', text: label || 'Notes (optional)' }), t);
}
function notes(s) { return (drafts[s.id] || '').trim() || undefined; }

function progress(s) {
  if (!s.parts.length) return null;
  var ul = el('ol', { class: 'steps', 'aria-label': 'Progress' });
  var cur = s.status === 'pending' ? 0 : s.cur;
  s.parts.forEach(function (p, i) {
    ul.appendChild(el('li', { class: i < cur ? 'did' : i === cur ? 'now' : '' }, (i < cur ? '✓ ' : '') + p.label + (p.attempt > 1 ? ' · try ' + p.attempt : '')));
  });
  if (s.answer.mode !== 'none') ul.appendChild(el('li', { class: cur >= s.parts.length ? 'now' : '' }, s.answer.mode === 'text' ? 'Your answer' : 'Your pick'));
  return ul;
}

function partPanel(s, i) {
  var p = s.parts[i];
  var last = i === s.parts.length - 1;
  var msg = p.message ? el('p', { class: 'msg', text: p.message }) : null;
  var instr = p.instructions ? el('p', { class: 'instr', text: p.instructions }) : null;
  var url = p.url ? el('p', { class: 'url' }, el('a', { href: p.url, target: '_blank', rel: 'noopener noreferrer', text: p.url })) : null;
  var startBtn = function (enabled) {
    var b = el('button', { class: 'primary big', type: 'button', disabled: !enabled, onclick: function () { act(s.id, 'start', { part: i + 1 }, b); } }, 'Start ' + p.label.toLowerCase());
    if (!s.parts.length || s.parts.length === 1) b.textContent = 'Start';
    return b;
  };
  var doneBtn = function (primary) {
    var b = el('button', { class: primary ? 'primary big' : '', type: 'button', onclick: function () { act(s.id, 'done', { part: i + 1, notes: last && s.answer.mode === 'none' ? notes(s) : undefined }, b); } }, 'Done');
    return b;
  };
  var st = p.state;
  if ((st === 'waiting' || st === 'loading') && p.gate) {
    return el('div', { class: 'panel wait' },
      el('h3', null, el('span', { class: 'spin', 'aria-hidden': 'true' }), (st === 'loading' ? 'Loading ' : 'Getting ') + p.label.toLowerCase() + (st === 'loading' ? ' on the phone…' : ' ready…')),
      el('p', { text: 'Wait a moment: Start turns on when ' + s.by + ' says it is ready.' }), msg, instr, url, startBtn(false));
  }
  var runner = p.ends === 'runner'; // I-059: the agent ends this part itself; the user gets no Done button
  if (st === 'waiting' || st === 'loading' || st === 'ready') {
    return el('div', { class: 'panel' },
      el('h3', { text: st === 'ready' ? p.label + ' is ready.' : p.label }), msg, instr, url,
      p.record ? el('p', { text: 'After Start, wait until it says "recording", then go.' }) : null,
      runner ? el('p', { class: 'ends', text: 'After Start, don’t tap anything: this part ends by itself, and the console will say when.' }) : null,
      startBtn(true));
  }
  if (runner && (st === 'started' || st === 'recording')) {
    var rec = st === 'recording' && p.record;
    return el('div', { class: 'panel ' + (rec ? 'rec' : 'wait'), role: 'status', 'data-runner-ends': '1' },
      rec ? el('div', { class: 'recline' }, el('span', { class: 'dot', 'aria-hidden': 'true' }), 'Recording… swipe now', el('span', { class: 'timer', 'data-since': p.at.recording }))
        : el('h3', null, el('span', { class: 'spin', 'aria-hidden': 'true' }), p.record ? 'Starting the recorder… don’t swipe yet.' : 'Running, please wait; this ends by itself.'),
      msg, instr,
      el('p', { class: 'ends', text: 'Don’t tap anything; the console will say when.' }),
      el('div', { class: 'row' }, el('span', { class: 'status', text: (rec ? 'Recording for ' : 'Running for ') }, el('span', { class: 'timer', 'data-since': p.at.started }), ' · ' + s.by + ' ends this part')));
  }
  if (st === 'started' && p.record) {
    return el('div', { class: 'panel wait' },
      el('h3', null, el('span', { class: 'spin', 'aria-hidden': 'true' }), 'Starting the recorder… don’t swipe yet.'),
      msg, instr,
      el('div', { class: 'row' }, el('span', { class: 'status', text: 'Waiting for ' + s.by + ' (' }, el('span', { class: 'timer', 'data-since': p.at.started }), ')'), doneBtn(false)));
  }
  if (st === 'recording') {
    return el('div', { class: 'panel rec', role: 'status' },
      el('div', { class: 'recline' }, el('span', { class: 'dot', 'aria-hidden': 'true' }), 'Recording… swipe now', el('span', { class: 'timer', 'data-since': p.at.recording })),
      msg, instr,
      last && s.answer.mode === 'none' ? notesBox(s) : null,
      el('p', { text: 'Click Done when you have finished.' }), doneBtn(true));
  }
  // started, no recorder: the user does it, then Done
  return el('div', { class: 'panel' },
    el('h3', { text: 'Go ahead' + (s.parts.length > 1 ? ': ' + p.label : '') }), msg, instr, url,
    last && s.answer.mode === 'none' ? notesBox(s) : null,
    doneBtn(true));
}

function answerPanel(s) {
  var box = el('div', { class: 'panel' });
  if (s.answer.mode === 'text') {
    var t = el('textarea', { placeholder: 'Type your answer', 'aria-label': 'Your answer', oninput: function () { drafts[s.id + ':text'] = t.value; } });
    t.value = drafts[s.id + ':text'] || '';
    var b = el('button', { class: 'primary big', type: 'button', onclick: function () { act(s.id, 'answer', { value: t.value, notes: notes(s) }, b); } }, 'Send answer');
    box.append(el('h3', { text: 'Your answer' }), t, notesBox(s), b);
    return box;
  }
  var sc = s.answer.scale, scaleRow = null;
  if (sc) {
    scaleRow = el('div', { class: 'scale', role: 'group', 'aria-label': sc.label });
    for (var k = sc.min; k <= sc.max; k++) (function (k) {
      var b = el('button', { type: 'button', 'aria-pressed': String(drafts[s.id + ':scale'] === k), onclick: function () {
        drafts[s.id + ':scale'] = drafts[s.id + ':scale'] === k ? undefined : k;
        scaleRow.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(Number(x.textContent) === drafts[s.id + ':scale'])); });
      } }, String(k));
      scaleRow.appendChild(b);
    })(k);
  }
  var opts = el('div', { class: 'opts' });
  s.answer.options.forEach(function (o) {
    var b = el('button', { class: 'primary', type: 'button', onclick: function () { act(s.id, 'answer', { value: o, notes: notes(s), scale: drafts[s.id + ':scale'] }, b); } }, o);
    opts.appendChild(b);
  });
  box.append(el('h3', { text: s.parts.length ? 'Your pick' : 'Your answer' }),
    sc ? el('label', { class: 'small', text: sc.label + ' (optional, choose before your pick)' }) : null, scaleRow, opts, notesBox(s));
  return box;
}

function openCard(s, first) {
  var body;
  if (s.status === 'pending' && !s.parts.length) {
    var b = el('button', { class: 'primary big', type: 'button', onclick: function () { act(s.id, 'start', {}, b); } }, 'Start');
    body = el('div', { class: 'panel' }, b);
  } else if (s.status === 'pending' || s.phase === 'part') body = partPanel(s, s.status === 'pending' ? 0 : s.cur);
  else body = answerPanel(s);
  var skip = el('button', { class: 'quiet', type: 'button', onclick: function () { act(s.id, 'skip', { notes: notes(s) }, skip); } }, 'Skip / not now');
  // I-059: "Start over" (two taps): every part again; the agent resets the phone first
  var overBtn = null, overAsk = null;
  if (s.status === 'active' && s.parts.length) {
    if (confirmOver[s.id]) {
      var yes = el('button', { class: 'primary', type: 'button', onclick: function () { delete confirmOver[s.id]; act(s.id, 'restart', {}, yes); } }, 'Yes, start over');
      overAsk = el('div', { class: 'panel wait', role: 'group', 'aria-label': 'Start over?' },
        el('p', { text: 'Start the whole step over? Every part runs again from the first one; ' + s.by + ' resets the phone first.' }),
        el('div', { class: 'row' }, yes, el('button', { type: 'button', onclick: function () { delete confirmOver[s.id]; render(); } }, 'Keep going')));
    } else overBtn = el('button', { class: 'quiet', type: 'button', onclick: function () { confirmOver[s.id] = true; render(); } }, 'Start over');
  }
  return el('section', { class: 'card' + (first ? ' first' : ''), 'aria-label': s.title, 'data-id': s.id },
    el('div', { class: 'meta' }, el('span', { class: 'pill', text: 'from ' + s.by }), el('span', { text: s.id }), el('span', { text: 'posted ' + ago(s.createdAt) })),
    el('h2', { text: s.title }),
    s.instructions ? el('p', { class: 'instr', text: s.instructions }) : null,
    s.url ? el('p', { class: 'url' }, el('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer', text: s.url })) : null,
    progress(s), body,
    overAsk,
    el('div', { class: 'foot' }, overBtn, skip));
}

function render() {
  var open = steps.filter(function (s) { return s.status === 'pending' || s.status === 'active'; });
  open.sort(function (a, b) { return (a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1); }); // stable: queue order otherwise
  var finished = steps.filter(function (s) { return s.status === 'answered' || s.status === 'skipped'; });
  var main = document.getElementById('open');
  var fa = document.activeElement, fsec = fa && fa.tagName === 'TEXTAREA' ? fa.closest('section') : null;
  var focusId = fsec ? fsec.getAttribute('data-id') : null, focusIdx = fsec ? Array.prototype.indexOf.call(fsec.querySelectorAll('textarea'), fa) : -1;
  main.replaceChildren();
  if (!open.length) main.appendChild(el('div', { class: 'empty' }, el('b', { text: 'Nothing to do right now.' }), 'New steps from the agents appear here by themselves.'));
  open.forEach(function (s, i) { main.appendChild(openCard(s, i === 0)); });
  if (focusId) { var sec = main.querySelector('section[data-id="' + focusId + '"]'); var ta = sec && sec.querySelectorAll('textarea')[Math.max(0, focusIdx)]; if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  var list = document.getElementById('done');
  list.replaceChildren();
  document.getElementById('done-h').hidden = !finished.length;
  finished.forEach(function (s) {
    var r = s.result || {};
    var bring = s.status === 'skipped' ? el('button', { class: 'quiet', type: 'button', onclick: function () { act(s.id, 'reopen', {}, bring); } }, 'Bring back') : null;
    list.appendChild(el('li', null,
      el('span', { class: 'ans', text: s.status === 'skipped' ? 'skipped' : (r.value === undefined ? '' : String(r.value)) }),
      el('span', { class: 't' }, s.title, r.notes ? el('span', { class: 'who', text: ' — ' + r.notes }) : null),
      el('span', { class: 'who', text: s.id + ' · ' + s.by }),
      el('span', { class: 'when', text: ago(s.updatedAt) }), bring));
  });
  tick();
  // opened from a notification or the banner on the other page: /#C-007
  if (!hashDone && /^#C-\d{1,6}$/.test(location.hash) && window.ConsoleNav) hashDone = ConsoleNav.reveal(location.hash.slice(1)) || !open.length;
}

function tick() {
  document.querySelectorAll('[data-since]').forEach(function (n) { var v = n.getAttribute('data-since'); if (v) n.textContent = clock(v); });
}

if (window.ConsoleNav) ConsoleNav.onChange = function () { if (!pending) load(); }; // a new or changed step: at once
load();
setInterval(load, 1000);
setInterval(tick, 250);
</script>
</body>
</html>
