<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix progress</title>
<link rel="stylesheet" href="/console-nav.css">
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
  --accent: #2f5bd3; --accent-ink: #ffffff; --accent-soft: #e8eefc;
  --ok: #23824a; --ok-soft: #e4f3ea; --bad: #c62f2f; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fdf3dc;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161716; --card: #202221; --ink: #ecebe6; --muted: #9b9a93; --line: #34362f;
    --accent: #7c9bff; --accent-ink: #0f1424; --accent-soft: #232b45;
    --ok: #5cc68a; --ok-soft: #1d3326; --bad: #ff6b6b; --bad-soft: #3a2020; --warn: #f0c060; --warn-soft: #3a3220;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161716; --card: #202221; --ink: #ecebe6; --muted: #9b9a93; --line: #34362f;
  --accent: #7c9bff; --accent-ink: #0f1424; --accent-soft: #232b45;
  --ok: #5cc68a; --ok-soft: #1d3326; --bad: #ff6b6b; --bad-soft: #3a2020; --warn: #f0c060; --warn-soft: #3a3220;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header h1 { font-size: 22px; margin: 0; font-weight: 650; }
.sub { color: var(--muted); font-size: 14px; flex: 1 1 240px; }
.status.off { color: var(--bad); font-weight: 600; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.banner { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; background: var(--warn-soft); font-size: 15px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.goal p { margin: 0 0 8px; font-size: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); }
.chip.bad { background: var(--bad-soft); }
.chip.ok { background: var(--ok-soft); }
.chip.warn { background: var(--warn-soft); }
.chip.muted { background: transparent; border: 1px solid var(--line); color: var(--muted); }
h2.section { font-size: 15px; color: var(--muted); font-weight: 650; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
.now { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.now .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.now .k { font-size: 13px; color: var(--muted); }
.now .v { font-weight: 600; }
.now .q, ul.agents .q, ul.build .q, .goal .q, p.q { font-size: 13px; color: var(--muted); }
.now .job { padding-top: 6px; margin-top: 6px; border-top: 1px solid var(--line); }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
ul.plain li:last-child { border-bottom: 0; }
.when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-right: 8px; }
.item h3 { margin: 6px 0 4px; font-size: 19px; line-height: 1.3; }
.item .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.stages { display: flex; gap: 3px; margin: 10px 0 2px; flex-wrap: wrap; }
.stages span { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.stages span.did { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.stages span.now { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 700; }
.stageplain { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.fixes { margin: 6px 0 10px; }
table.nums { border-collapse: collapse; width: 100%; font-size: 15px; margin: 4px 0 10px; }
table.nums td { padding: 6px 8px 6px 0; vertical-align: top; border-top: 1px solid var(--line); }
table.nums td.ba { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 650; }
table.nums .note { color: var(--muted); font-size: 13px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); }
.tag.CONFIRMED { background: var(--ok-soft); color: var(--ok); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 6px 0; font-size: 15px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }
.new { color: var(--bad); font-weight: 700; }
details { margin-top: 8px; font-size: 14px; }
details summary { cursor: pointer; color: var(--muted); }
details ul { margin: 6px 0 0; padding-left: 18px; }
details li { margin: 3px 0; color: var(--muted); word-break: break-word; }
.dropped .item h3 { font-size: 16px; }
.empty { color: var(--muted); }
.tablewrap { overflow-x: auto; }
section[data-item] { scroll-margin-top: 80px; }
</style>
</head>
<body>
<!--console-menu-->
<div class="wrap">
  <header>
    <h1 id="h1">Fix progress</h1>
    <span class="sub" id="upd">loading…</span>
  </header>
  <div id="banners"></div>
  <main id="main"></main>
</div>
<script src="/console-nav.js"></script>
<script>
'use strict';
// the top bar, badge, theme and notifications: /console-nav.js (shared with the steps page)

// DOM helper: text only (textContent), never HTML from the data
function el(tag, attrs) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === undefined || c === null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
function hhmm(iso) { return iso ? iso.slice(11, 16) + 'Z' : '?'; }
function ago(min) { if (min === null || min === undefined) return ''; if (min < 1) return 'just now'; if (min < 60) return min + ' min ago'; return Math.floor(min / 60) + ' h ' + (min % 60) + ' min ago'; }
var STAGES = ['R', 'I', 'D', 'F', 'V', 'L'];
var open = {}; // which details are open, kept across refreshes

// I-060 (user T-020): one job on a device in plain words: what (and the time left), who runs it for whom since when,
// the phone run going on now, and the holder's other jobs as "Next"
function jobLines(box, j) {
  box.appendChild(el('div', { class: 'v', text: j.line }));
  box.appendChild(el('div', { class: 'q', text: j.byLine }));
  if (j.run) box.appendChild(el('div', { class: 'q', text: 'Right now: ' + j.run.text + ' (since ' + hhmm(j.run.since) + ')' }));
  j.next.forEach(function (n) { box.appendChild(el('div', { class: 'q', text: 'Next: ' + n })); });
}

function holder(label, l, d) {
  var box = el('div', { class: 'box' }, el('div', { class: 'k', text: label }));
  if (!l) { box.appendChild(el('div', { class: 'v', text: 'unknown' })); return box; }
  var jobs = d && d.jobs ? d.jobs : [];
  if (l.shared) {
    // the chrome-measure shared lane (I-048): the readers' names first (user T-008), then the weight in use against
    // the cap, then every reader's job (I-060; without the device view: its weight and start time)
    var s = l.shared;
    var names = s.readers.map(function (x) { return x.owner; }).join(', ') || 'no live reader';
    box.appendChild(el('div', { class: jobs.length ? 'q' : 'v', text: (jobs.length ? 'Shared by ' : '') + names + ' (shared lane ' + s.used + '/' + (s.cap === null ? '?' : s.cap) + ')' }));
    if (jobs.length) jobs.forEach(function (j) { var sub = el('div', { class: 'job' }); jobLines(sub, j); box.appendChild(sub); });
    else s.readers.forEach(function (x) { box.appendChild(el('div', { class: 'q', text: x.owner + ' (w' + x.weight + ', since ' + hhmm(x.since) + ')' })); });
    if (l.lane && !l.lane.on) box.appendChild(el('div', { class: 'q', text: 'switch off: no new reader joins' }));
    if (s.joinsClosed) box.appendChild(el('div', { class: 'q', text: 'joins closed: ' + s.closedBy + ' waits for Chrome alone' }));
  } else {
    if (l.holder && jobs.length) jobLines(box, jobs[0]);
    else {
      box.appendChild(el('div', { class: 'v', text: l.holder ? l.holder.owner : 'free' }));
      if (l.holder) box.appendChild(el('div', { class: 'q', text: 'since ' + hhmm(l.holder.since) }));
      else if (l.handover) box.appendChild(el('div', { class: 'q', text: l.handover.text })); // I-051: a stalled hand-over shows
    }
    if (l.lane && l.lane.on) box.appendChild(el('div', { class: 'q', text: 'shared lane on, cap ' + l.lane.cap }));
  }
  if (l.queue.length) box.appendChild(el('div', { class: 'q', text: 'In line after it: ' + l.queue.join(', ') }));
  return box;
}

// I-060: one line per working agent (what it does, what it waits on); parked, not started or stale rows folded
function agentsSection(m, a) {
  if (!a || (!a.agents.length && !a.folded.length)) return;
  m.appendChild(el('h2', { class: 'section', text: 'Who is doing what' }));
  var ul = el('ul', { class: 'plain card agents' });
  a.agents.forEach(function (x) {
    var li = el('li', null, el('b', { text: x.owner + ': ' }), x.doing);
    li.appendChild(el('div', { class: 'q', text: [x.state].concat(x.using).join(' · ') }));
    if (x.waits.length) li.appendChild(el('div', { class: 'q', text: 'Waiting on: ' + x.waits.join(' · ') }));
    x.also.forEach(function (t) { li.appendChild(el('div', { class: 'q', text: 'Also: ' + t })); });
    ul.appendChild(li);
  });
  if (!a.agents.length) ul.appendChild(el('li', { class: 'empty', text: 'Nobody is working on something right now.' }));
  m.appendChild(ul);
  var fd = detailsBox('__folded', 'Paused, not started or not updated (' + a.folded.length + ')',
    a.folded.map(function (f) { return f.owner + ': ' + f.title + ' (' + f.why + ')'; }));
  if (fd) m.appendChild(fd);
}

function stageRow(it) {
  var row = el('div', { class: 'stages', 'aria-label': 'Stage ' + it.stage.code + ' of R I D F V L' });
  STAGES.forEach(function (s, i) { row.appendChild(el('span', { class: i < it.stage.index ? 'did' : i === it.stage.index ? 'now' : '', text: s })); });
  return row;
}

function detailsBox(key, summary, lines) {
  if (!lines.length) return null;
  var d = el('details', { 'data-key': key });
  if (open[key]) d.open = true;
  d.addEventListener('toggle', function () { open[key] = d.open; });
  var ul = el('ul');
  lines.forEach(function (l) { ul.appendChild(el('li', { text: l })); });
  d.append(el('summary', { text: summary }), ul);
  return d;
}

function itemCard(it, compact) {
  var card = el('section', { class: 'card item', 'aria-label': it.title, 'data-item': it.id });
  card.appendChild(el('div', { class: 'meta' },
    el('span', { class: 'chip', text: it.areaLabel }),
    it.attention ? el('span', { class: 'chip bad', text: 'new result' }) : null,
    it.status ? el('a', { class: 'chip' + (it.status.stale ? ' warn' : ''), href: '/status#' + encodeURIComponent(it.status.id), title: it.status.plain + (it.status.waits.length ? ' · ' + it.status.waits.join(' · ') : ''), text: 'now: ' + it.status.state + (it.status.waits.length ? ' · ' + it.status.waits[0] : '') }) : null,
    it.owner ? el('span', { text: 'owner: ' + it.owner }) : null));
  card.appendChild(el('h3', { text: it.title }));
  if (!compact) {
    card.appendChild(stageRow(it));
    card.appendChild(el('div', { class: 'stageplain', text: 'Stage ' + it.stage.code + ' (' + it.stage.name + '): ' + it.stage.plain }));
  }
  if (it.why) card.appendChild(el('p', { class: 'fixes' }, el('b', { text: 'Why: ' }), it.why));
  if (it.fixes && !compact) card.appendChild(el('p', { class: 'fixes', text: it.fixes }));
  if (it.best.length) {
    var t = el('table', { class: 'nums' });
    it.best.forEach(function (b) {
      t.appendChild(el('tr', null,
        el('td', null, b.what, b.note ? el('div', { class: 'note', text: b.note }) : null),
        el('td', { class: 'ba', text: b.before + ' → ' + b.after }),
        el('td', null, el('span', { class: 'tag ' + b.tag, text: b.tag }), el('div', { class: 'note', text: b.driver + (b.ref ? ' · ' + b.ref : '') }))));
    });
    card.appendChild(el('div', { class: 'tablewrap' }, t));
  }
  var kv = el('dl', { class: 'kv' });
  function add(k, v) { if (v) kv.append(el('dt', { text: k }), el('dd', null, v)); }
  if (it.felt) add('You', it.felt.plain + (it.felt.text ? ' (' + it.felt.text + ')' : ''));
  add('Gate', it.gate);
  it.checks.forEach(function (c) {
    var v = el('span', null, c.what + ': ');
    if (c.result) v.appendChild(el('b', { text: c.result }));
    else if (c.newResult) v.appendChild(el('span', { class: 'new', text: 'NEW in the ledger: ' + c.ledger + ' (summary not updated yet)' }));
    else v.appendChild(el('span', { text: c.ledger }));
    add(c.id, v);
  });
  add('Next', it.next);
  if (kv.childNodes.length) card.appendChild(kv);
  var dd = detailsBox(it.id, 'Technical details', it.details);
  if (dd) card.appendChild(dd);
  return card;
}

// I-061 (user T-021): today's best build. /build shows it in full; /progress shows a short card linking to it
var BUILD_PAGE = /^\/build(\.html)?$/.test((typeof location !== 'undefined' && location.pathname) || '');
function gainRow(t, b, extra) {
  t.appendChild(el('tr', null,
    el('td', null, b.what, b.note ? el('div', { class: 'note', text: b.note }) : null),
    el('td', { class: 'ba', text: b.before + ' → ' + b.after }),
    el('td', null, el('span', { class: 'tag ' + b.tag, text: b.tag }), el('div', { class: 'note', text: [b.driver].concat(extra || [], b.ref ? [b.ref] : []).join(' · ') }))));
}
function writeupLink(w) { return w ? el('a', { href: w.url, text: 'Write-up' }) : null; }
function renderBuild(m, b) {
  if (!b) { m.appendChild(el('p', { class: 'empty', text: 'No best build is written up yet (the "build" part of fixes/PROGRESS.json; mgmt-ops fills it in).' })); return; }
  var head = el('section', { class: 'card goal', 'aria-label': 'Best build' }, el('p', null, el('b', { text: b.name })),
    el('div', { class: 'q', text: 'The best build since ' + hhmm(b.since) + ' ' + String(b.since).slice(0, 10) + ' · ' + b.applied.length + ' fix' + (b.applied.length === 1 ? '' : 'es') + ' in it' }));
  if (b.summary) head.appendChild(el('p', { class: 'fixes', text: b.summary }));
  m.appendChild(head);
  m.appendChild(el('h2', { class: 'section', text: 'In today’s best build' }));
  var ul = el('ul', { class: 'plain card build' });
  b.applied.forEach(function (a) {
    var li = el('li', { 'data-fix': a.id }, el('b', { text: a.title }), a.writeup ? ' ' : null, writeupLink(a.writeup));
    if (a.fixes) li.appendChild(el('div', { class: 'q', text: a.fixes }));
    if (a.gain) { var t = el('table', { class: 'nums' }); gainRow(t, a.gain); li.appendChild(el('div', { class: 'tablewrap' }, t)); }
    else li.appendChild(el('div', { class: 'q', text: 'No measured phone gain yet.' }));
    if (a.felt) li.appendChild(el('div', { class: 'q', text: 'You: ' + a.felt.plain + (a.felt.text ? ' (' + a.felt.text + ')' : '') }));
    var more = detailsBox('build-' + a.id, 'Its other numbers', a.more.map(function (x) { return x.what + ': ' + x.before + ' → ' + x.after + ' (' + x.tag + ', ' + x.driver + (x.ref ? ', ' + x.ref : '') + ')'; }));
    if (more) li.appendChild(more);
    ul.appendChild(li);
  });
  if (!b.applied.length) ul.appendChild(el('li', { class: 'empty', text: 'No fixes listed yet.' }));
  m.appendChild(ul);
  m.appendChild(el('h2', { class: 'section', text: 'The whole build vs the original page' }));
  if (b.combined.length) {
    var t = el('table', { class: 'nums' });
    b.combined.forEach(function (c) { gainRow(t, c, ['measured ' + hhmm(c.when) + ' ' + String(c.when).slice(0, 10)].concat(c.how ? [c.how] : [])); });
    m.appendChild(el('section', { class: 'card', 'aria-label': 'Whole build' }, el('div', { class: 'tablewrap' }, t)));
  } else m.appendChild(el('p', { class: 'empty', text: 'Not measured as a whole yet.' }));
  m.appendChild(el('h2', { class: 'section', text: 'Tried, not applied' }));
  var tu = el('ul', { class: 'plain card build' });
  b.tried.forEach(function (x) {
    tu.appendChild(el('li', { 'data-fix': x.id }, el('b', { text: x.title + ': ' }), x.why || 'no reason written yet', x.writeup ? ' ' : null, writeupLink(x.writeup)));
  });
  if (!b.tried.length) tu.appendChild(el('li', { class: 'empty', text: 'Nothing dropped yet.' }));
  m.appendChild(tu);
  if (b.open.length) m.appendChild(el('p', { class: 'q' }, 'Still being worked on: ' + b.open.map(function (o) { return o.title; }).join('; ') + ' (', el('a', { href: '/progress', text: 'see Progress' }), ')'));
}
function buildCard(m, b) {
  if (!b) return;
  m.appendChild(el('section', { class: 'card', 'aria-label': 'Best build' },
    el('div', { class: 'k', text: 'Today’s best build' }),
    el('p', { class: 'fixes' }, el('b', { text: b.name }), ': ' + b.applied.length + ' fix' + (b.applied.length === 1 ? '' : 'es') + ' in it, ' + b.tried.length + ' tried and not applied. ', el('a', { href: '/build', text: 'See what is in it and why' }))));
}

function render(v) {
  var s = v.summary;
  document.getElementById('upd').textContent = s.updatedAt
    ? 'Summary ' + hhmm(s.updatedAt) + ' (' + ago(s.ageMin) + ') by ' + s.updatedBy + ' · live ' + hhmm(v.now)
    : 'No summary yet · live ' + hhmm(v.now);
  var ban = document.getElementById('banners');
  ban.replaceChildren();
  s.errors.forEach(function (e) { ban.appendChild(el('div', { class: 'banner', text: 'Summary file problem: ' + e })); });
  if (s.stale) ban.appendChild(el('div', { class: 'banner', text: 'The summary is more than a few hours old; the live parts below are current.' }));
  if (s.newResults) ban.appendChild(el('div', { class: 'banner', text: s.newResults + ' new result(s) arrived after the summary was written (marked "new result").' }));

  var m = document.getElementById('main');
  m.replaceChildren();
  if (BUILD_PAGE) { renderBuild(m, v.build); return; }
  if (v.goal || v.complaints.length) {
    var g = el('section', { class: 'card goal', 'aria-label': 'Goal' });
    if (v.goal) g.appendChild(el('p', { text: v.goal }));
    if (v.complaints.length) {
      var ch = el('div', { class: 'chips' }, el('span', { class: 'chip muted', text: 'You flagged' }));
      v.complaints.forEach(function (c) { ch.appendChild(el('span', { class: 'chip bad', title: c.text, text: c.areaLabel })); });
      g.appendChild(ch);
    }
    m.appendChild(g);
  }
  buildCard(m, v.build);
  if (v.changes.length) {
    m.appendChild(el('h2', { class: 'section', text: 'What changed' }));
    var ul = el('ul', { class: 'plain card' });
    v.changes.forEach(function (c) { ul.appendChild(el('li', null, el('span', { class: 'when', text: hhmm(c.at) }), c.text)); });
    m.appendChild(ul);
  }
  m.appendChild(el('h2', { class: 'section', text: 'Right now' }));
  var dev = v.live.devices || {};
  var now = el('div', { class: 'now' }, holder('On the phone', v.live.phone, dev.phone), holder('On Chrome (Mac)', v.live.chrome, dev.chrome));
  if (v.live.incidents) {
    var ib = el('div', { class: 'box' }, el('div', { class: 'k', text: 'Tool problems' }),
      el('div', { class: 'v', text: v.live.incidents.open + ' open, ' + v.live.incidents.blocking.length + ' blocking' }));
    v.live.incidents.blocking.forEach(function (i) { ib.appendChild(el('div', { class: 'q', text: i.id + ': ' + i.title })); });
    now.appendChild(ib);
  }
  m.appendChild(now);
  v.live.errors.forEach(function (e) { m.appendChild(el('div', { class: 'banner', text: e })); });
  agentsSection(m, v.agents);

  m.appendChild(el('h2', { class: 'section', text: 'Coming up for you' }));
  var cu = el('ul', { class: 'plain card' });
  if (v.waiting) {
    if (v.waiting.length) v.waiting.forEach(function (w) { cu.appendChild(el('li', null, el('a', { href: /^C-\d{1,6}$/.test(w.id) ? '/#' + w.id : '/', text: 'Waiting now: ' + w.title }), el('span', { class: 'when', text: ' ' + w.id }))); });
    else cu.appendChild(el('li', { class: 'empty', text: 'Nothing waiting on the console right now.' }));
  }
  v.upcoming.forEach(function (u) { cu.appendChild(el('li', null, u.title, el('span', { class: 'when', text: ' · ' + u.when }))); });
  m.appendChild(cu);

  v.sections.forEach(function (sec) {
    if (!sec.items.length) return;
    m.appendChild(el('h2', { class: 'section', text: sec.label }));
    var wrap = el('div', { class: sec.key === 'dropped' ? 'dropped' : '' });
    sec.items.forEach(function (it) { wrap.appendChild(itemCard(it, sec.key === 'dropped')); });
    m.appendChild(wrap);
  });
  if (v.live.incidents && v.live.incidents.list.length) {
    var lines = v.live.incidents.list.map(function (i) { return i.id + (i.blocking ? ' (blocking)' : '') + ': ' + i.title; });
    m.appendChild(detailsBox('__incidents', 'All open tool problems (' + lines.length + ')', lines));
  }
}

var sig = '', hashDone = false;
// /progress#<item id> (linked from the status board): scroll to that item once
function revealHash() {
  if (hashDone || !/^#[a-z0-9][a-z0-9-]{0,40}$/.test(location.hash)) return;
  var sec = document.querySelector('section[data-item="' + location.hash.slice(1) + '"]');
  if (!sec) return;
  hashDone = true;
  sec.scrollIntoView({ block: 'start' });
  sec.classList.add('flash');
}
function load() {
  return fetch('/api/progress', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
    document.getElementById('upd').className = 'sub';
    var s = JSON.stringify(v, function (k, x) { return k === 'now' || k === 'ageMin' ? undefined : x; });
    if (s !== sig) { sig = s; render(v); revealHash(); }
    else document.getElementById('upd').textContent = document.getElementById('upd').textContent.replace(/live \S+$/, 'live ' + hhmm(v.now));
  }).catch(function () {
    var u = document.getElementById('upd'); u.textContent = 'not connected: is console.mjs serve running?'; u.className = 'sub status off';
  });
}
if (window.ConsoleNav) ConsoleNav.onChange = function () { load(); }; // a step came or went: refresh "Coming up for you"
if (BUILD_PAGE) { var h1 = document.getElementById('h1'); if (h1) h1.textContent = 'Today’s best build'; document.title = 'Best build'; }
load();
setInterval(load, 15000);
</script>
