<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposals</title>
<link rel="stylesheet" href="/console-nav.css">
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
  --accent: #2f5bd3; --accent-ink: #ffffff; --accent-soft: #e8eefc;
  --ok: #23824a; --ok-soft: #e4f3ea; --bad: #c62f2f; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fdf3dc;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161716; --card: #202221; --ink: #ecebe6; --muted: #9b9a93; --line: #34362f;
    --accent: #7c9bff; --accent-ink: #0f1424; --accent-soft: #232b45;
    --ok: #5cc68a; --ok-soft: #1d3326; --bad: #ff6b6b; --bad-soft: #3a2020; --warn: #f0c060; --warn-soft: #3a3220;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161716; --card: #202221; --ink: #ecebe6; --muted: #9b9a93; --line: #34362f;
  --accent: #7c9bff; --accent-ink: #0f1424; --accent-soft: #232b45;
  --ok: #5cc68a; --ok-soft: #1d3326; --bad: #ff6b6b; --bad-soft: #3a2020; --warn: #f0c060; --warn-soft: #3a3220;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* I-092: a class display rule must not show a hidden element */
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
header h1 { font-size: 22px; margin: 0; font-weight: 650; }
.sub { color: var(--muted); font-size: 14px; flex: 1 1 240px; }
.status.off { color: var(--bad); font-weight: 600; }
.intro { color: var(--muted); font-size: 15px; margin: 0 0 18px; max-width: 760px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
h2.section { font-size: 15px; color: var(--muted); font-weight: 650; margin: 24px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
.list a.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; text-decoration: none; color: inherit; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); margin-bottom: 8px; }
.list a.row:hover { border-color: var(--accent); }
.list a.row.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.list .t { font-weight: 650; flex: 1 1 260px; }
.list .m { color: var(--muted); font-size: 13px; }
.chip { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); white-space: nowrap; }
.chip.waiting { background: var(--bad); color: #fff; font-weight: 650; }
.chip.accepted { background: var(--ok-soft); color: var(--ok); }
.chip.rejected { background: var(--bad-soft); color: var(--bad); }
.chip.changes-requested { background: var(--warn-soft); color: var(--warn); }
.chip.muted { background: transparent; border: 1px solid var(--line); color: var(--muted); }
/* T-030: a proposal on hold (the note on top, the decision off) and a stale decision (decide again) */
.chip.held { background: var(--warn); color: #fff; font-weight: 650; }
.holdbanner, .stalebanner { border-radius: 12px; padding: 12px 16px; margin: 0 0 14px; border: 2px solid var(--warn); background: var(--warn-soft); }
.holdbanner strong, .stalebanner strong { display: block; font-size: 17px; color: var(--warn); }
.holdbanner p, .stalebanner p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.stalebanner { border-color: var(--accent); background: var(--accent-soft); }
.stalebanner strong { color: var(--accent); }
.detail h2.title { margin: 4px 0 6px; font-size: 24px; line-height: 1.25; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.block { margin: 16px 0 0; }
.block h3 { margin: 0 0 4px; font-size: 16px; }
.block p { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.block ul { margin: 0; padding-left: 20px; }
.block li { margin: 3px 0; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; }
table.gain { border-collapse: collapse; width: 100%; font-size: 15px; }
table.gain th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 4px 10px 4px 0; }
table.gain td { padding: 6px 10px 6px 0; vertical-align: top; border-top: 1px solid var(--line); }
table.gain td.n { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 650; }
table.gain .how { color: var(--muted); font-size: 13px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.tag.CONFIRMED { background: var(--ok-soft); color: var(--ok); }
.tag.estimate { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.tag.phone { background: var(--accent-soft); color: var(--accent); margin-left: 4px; }
.decision { border-radius: 12px; padding: 10px 14px; margin: 12px 0 0; font-size: 15px; background: var(--accent-soft); }
.decision.accepted { background: var(--ok-soft); }
.decision.rejected { background: var(--bad-soft); }
.decision.changes-requested { background: var(--warn-soft); }
.decision p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
/* compare */
.cmp-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; border: 0; background: var(--card); color: var(--ink); padding: 8px 14px; cursor: pointer; min-height: 40px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pairs { display: flex; gap: 6px; flex-wrap: wrap; }
.pairs button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; min-height: 32px; }
.pairs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.caption { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .side { grid-template-columns: 1fr; } }
figure { margin: 0; }
figure figcaption { font-size: 13px; font-weight: 650; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
figure img, figure video { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #000; }
.stage { position: relative; max-width: 560px; margin: 0 auto; user-select: none; }
.stage img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
.stage .over { position: absolute; inset: 0; }
.stage .over img { width: 100%; height: 100%; object-fit: fill; }
.stage .split { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
.stage .lbl { position: absolute; top: 8px; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff; pointer-events: none; }
.stage .lbl.l { left: 8px; } .stage .lbl.r { right: 8px; }
.range { display: block; width: 100%; max-width: 560px; margin: 10px auto 0; }
.blinkbar { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
button.btn { font: inherit; font-size: 15px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px; min-height: 42px; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
button.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 650; }
button.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 650; }
button.btn.warn { background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 650; }
button.btn[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent-soft); }
button.btn:disabled { opacity: .55; cursor: not-allowed; }
.live { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.live a.btn { display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); text-decoration: none; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
textarea { width: 100%; min-height: 90px; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 10px 0 8px; }
.to { font-size: 14px; color: var(--muted); margin: 10px 0 0; overflow-wrap: anywhere; }
.to b { color: var(--ink); font-weight: 650; }
.err { color: var(--bad); font-weight: 600; margin: 6px 0 0; }
.empty { color: var(--muted); }
details.hist { margin-top: 14px; font-size: 14px; }
details.hist summary { cursor: pointer; color: var(--muted); }
details.hist li { color: var(--muted); }
/* options (I-053): one proposal, several solutions; the cards are the tabs */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 8px 0 4px; }
.opts button.opt { font: inherit; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 44px; }
.opts button.opt:hover { border-color: var(--accent); }
.opts button.opt[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--accent-soft); }
.opts .ol { font-weight: 650; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.opts .og { font-size: 13px; font-variant-numeric: tabular-nums; }
.opts .od { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.chip.rec { background: var(--ok-soft); color: var(--ok); font-size: 12px; font-weight: 650; }
.optpanel { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
.optpanel h3.oh { font-size: 18px; margin: 12px 0 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.rec-why { font-size: 14px; margin: 8px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--ok-soft); overflow-wrap: anywhere; }
fieldset.optpick { border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; padding: 8px 12px 10px; }
fieldset.optpick legend { font-size: 14px; font-weight: 650; padding: 0 4px; }
fieldset.optpick label { display: flex; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; font-size: 15px; }
fieldset.optpick input { width: 18px; height: 18px; margin: 0; }
/* I-074: try it live, the original (A) and the proposal (B) as real pages, side by side */
.tryit h3 { margin: 0 0 4px; font-size: 16px; }
.trybar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.trynote { border-radius: 10px; padding: 8px 12px; margin: 8px 0; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 14px; }
.trypair { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px; }
.trypair figure { flex: 0 0 auto; }
.trypair iframe { display: block; width: 430px; height: 932px; max-height: 85vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<!--console-menu-->
<div class="wrap">
  <header>
    <h1>Proposals</h1>
    <span class="sub" id="upd">loading…</span>
  </header>
  <p class="intro">Each proposal swaps an expensive effect on the page for a cheaper one that should look the same, or nearly the same. Compare the original (A) with the proposal (B), then accept it, reject it, or ask for a change.</p>
  <main>
    <div id="list" class="list"></div>
    <div id="detail"></div>
    <div id="tryit"></div>
    <div id="decide"></div>
  </main>
</div>
<script src="/console-nav.js"></script>
<script>
'use strict';
// The console's proposals page (ts-proposals). Data: GET /api/proposals (list), GET /api/proposals/<id> (one), media
// from /media/<id>/<name>. Decisions: POST /api/proposals/<id>/decide|undo with the x-console header. Every string
// from the data is shown with textContent (el()), never as HTML.
// Options (I-053): a proposal may carry several solutions (p.options), each with its own idea, visual difference,
// gain, risk and B shots against the shared original A. The option cards are tabs; Accept asks which option, and
// sends it as `option`. A proposal without options renders exactly as before.
// Holds and stale decisions (T-030): p.hold {by, note, at} puts a banner with the note on top of the proposal and turns
// the decision buttons off (the server refuses a decision too); a decision already made is shown "under review". A
// revision after a decision makes it stale (p.decisionState 'stale', p.staleDecision): a banner asks to decide again.
var ID = /^PR-\d{3,6}$/;
var STATE_TEXT = { proposed: 'waiting for you', accepted: 'accepted', rejected: 'rejected', 'changes-requested': 'change requested' };
var AREA_TEXT = { hero: 'Top of the page (hero)', middle: 'Middle of the page', end: 'End of the page', whole: 'Whole page' };
var VERB = { accept: 'Accept', reject: 'Reject', change: 'Request change' };

function el(tag, attrs) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === undefined || c === null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
function when(iso) { return iso ? iso.slice(0, 10) + ' ' + iso.slice(11, 16) + 'Z' : ''; }
/** Only same-origin /media/ paths become a src; only localhost http(s) URLs become a link. */
function mediaSrc(p) { return typeof p === 'string' && /^\/media\/PR-\d{3,6}\/[A-Za-z0-9.-]+$/.test(p) ? p : null; }
function localUrl(u) {
  try { var x = new URL(u); return /^https?:$/.test(x.protocol) && ['localhost', '127.0.0.1', '[::1]'].indexOf(x.hostname) >= 0 ? x.href : null; } catch (e) { return null; }
}
function currentId() { var h = decodeURIComponent(location.hash.slice(1)); return ID.test(h) ? h : null; }

// ---- state kept across refreshes ----
var listSig = '', detailSig = '', current = null, drafts = {}, pick = {}, view = {}, pair = {}, blinkTimer = null, slider = {};
var optTab = {}, optPick = {}; // I-053: the option shown, and the option picked in the decision box, per proposal

// ---- the list ----
function renderList(items) {
  var box = document.getElementById('list');
  box.replaceChildren();
  var waiting = items.filter(function (p) { return p.state === 'proposed' && !p.hold; });
  var held = items.filter(function (p) { return !!p.hold; });
  var rest = items.filter(function (p) { return p.state !== 'proposed' && !p.hold; });
  function row(p) {
    var chip = p.hold ? el('span', { class: 'chip held', text: 'On hold' + (p.decision ? ' · ' + (STATE_TEXT[p.decision.value] || p.decision.value) + ', under review' : '') })
      : el('span', { class: 'chip ' + (p.state === 'proposed' ? 'waiting' : p.state), text: p.decisionState === 'stale' ? 'decide again' : (STATE_TEXT[p.state] || p.state) });
    var a = el('a', { class: 'row' + (p.id === currentId() ? ' cur' : ''), href: '#' + p.id }, chip,
      el('span', { class: 't', text: p.title }),
      el('span', { class: 'm', text: p.id + ' · ' + (AREA_TEXT[p.area] || p.area) + ' · by ' + p.by + (p.rev > 1 ? ' · revision ' + p.rev : '') + (p.options ? ' · ' + p.options + ' options' : '') + ' · to: ' + toNames(p) }));
    return a;
  }
  box.appendChild(el('h2', { class: 'section', text: 'Waiting for you (' + waiting.length + ')' }));
  if (!waiting.length) box.appendChild(el('p', { class: 'empty', text: 'Nothing waiting. New proposals show up here with a chime.' }));
  waiting.forEach(function (p) { box.appendChild(row(p)); });
  if (held.length) {
    box.appendChild(el('h2', { class: 'section', text: 'On hold, please don\'t decide yet (' + held.length + ')' }));
    held.forEach(function (p) { box.appendChild(row(p)); });
  }
  if (rest.length) {
    box.appendChild(el('h2', { class: 'section', text: 'Decided (' + rest.length + ')' }));
    rest.forEach(function (p) { box.appendChild(row(p)); });
  }
}

// ---- compare ----
function stopBlink() { if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; } }
/** p: {id, compare}; key: where the pair and slider positions are kept (one per option). */
function compareBlock(p, key, anchor) {
  var pk = key || p.id, an = anchor || p.id; // I-090: the comment anchor of this block (PR-009 or PR-009/option:x)
  var c = p.compare || {}, shots = c.shots || [], wrap = el('div', { class: 'block' }, el('h3', { text: 'Compare' })), outer = wrap;
  var aL = (c.a && c.a.label) || 'Original', bL = (c.b && c.b.label) || 'Proposal';
  if (shots.length) {
    var v = view[p.id] || c.view || 'side', i = Math.min(pair[pk] || 0, shots.length - 1), s = shots[i];
    var bar = el('div', { class: 'cmp-bar' });
    var seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'How to compare' });
    [['side', 'Side by side'], ['slider', 'Slider'], ['blink', 'Blink']].forEach(function (o) {
      var b = el('button', { type: 'button', 'aria-pressed': String(v === o[0]), text: o[1] });
      b.addEventListener('click', function () { view[p.id] = o[0]; stopBlink(); renderDetail(current, true); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    if (shots.length > 1) {
      var pairs = el('div', { class: 'pairs', role: 'group', 'aria-label': 'Scroll position' });
      shots.forEach(function (x, k) {
        var b = el('button', { type: 'button', 'aria-pressed': String(k === i), text: x.caption || ('Position ' + (k + 1)) });
        b.addEventListener('click', function () { pair[pk] = k; renderDetail(current, true); });
        pairs.appendChild(b);
      });
      bar.appendChild(pairs);
    }
    wrap.appendChild(bar);
    // I-090: the shot on screen can be commented; its caption is the label
    wrap = wrap.appendChild(el('div', { class: 'shot', 'data-anchor': an + '/shot:' + (i + 1), 'data-anchor-label': s.caption || ('Position ' + (i + 1)) }));
    if (s.caption) wrap.appendChild(el('p', { class: 'caption', text: s.caption }));
    var A = mediaSrc(s.a), B = mediaSrc(s.b);
    function full(src, label) { return src ? el('a', { href: src, target: '_blank', rel: 'noopener noreferrer', text: 'full size' }) : null; }
    if (v === 'side') {
      wrap.appendChild(el('div', { class: 'side' },
        el('figure', null, el('figcaption', null, el('span', { text: 'A · ' + aL }), full(A)), A ? el('img', { src: A, alt: 'A: ' + aL + (s.caption ? ', ' + s.caption : '') }) : null),
        el('figure', null, el('figcaption', null, el('span', { text: 'B · ' + bL }), full(B)), B ? el('img', { src: B, alt: 'B: ' + bL + (s.caption ? ', ' + s.caption : '') }) : null)));
    } else if (v === 'slider') {
      var pos = slider[p.id] === undefined ? 50 : slider[p.id];
      var over = el('div', { class: 'over' }, el('img', { src: B, alt: '' }));
      var line = el('div', { class: 'split' });
      var stage = el('div', { class: 'stage' }, el('img', { src: A, alt: 'A: ' + aL + ' (left of the line), B: ' + bL + ' (right)' }), over, line,
        el('span', { class: 'lbl l', text: 'A · ' + aL }), el('span', { class: 'lbl r', text: 'B · ' + bL }));
      var range = el('input', { type: 'range', class: 'range', min: '0', max: '100', step: '1', value: String(pos), 'aria-label': 'Split between A (left) and B (right)' });
      function apply(x) { over.style.clipPath = 'inset(0 0 0 ' + x + '%)'; line.style.left = 'calc(' + x + '% - 1px)'; }
      apply(pos);
      range.addEventListener('input', function () { slider[p.id] = Number(range.value); apply(range.value); });
      wrap.appendChild(stage); wrap.appendChild(range);
      wrap.appendChild(el('p', { class: 'hint', text: 'Left of the line: A (' + aL + '). Right of the line: B (' + bL + '). Drag the slider or use the arrow keys.' }));
    } else {
      var showB = false;
      var img = el('img', { src: A, alt: 'A: ' + aL });
      var tag = el('span', { class: 'lbl l', text: 'A · ' + aL });
      var st = el('div', { class: 'stage' }, img, tag);
      function flip(toB) { showB = toB === undefined ? !showB : toB; img.src = showB ? B : A; img.alt = (showB ? 'B: ' + bL : 'A: ' + aL); tag.textContent = showB ? 'B · ' + bL : 'A · ' + aL; tb.textContent = showB ? 'Show A' : 'Show B'; }
      var tb = el('button', { type: 'button', class: 'btn primary', text: 'Show B' });
      tb.addEventListener('click', function () { stopBlink(); auto.checked = false; flip(); });
      var auto = el('input', { type: 'checkbox', id: 'blink-auto' });

  var sig = JSON.stringify(p);
  if (!force && sig === detailSig) return;
  // don't redraw under the user's typing, except for a hold (T-030: the decision must turn off at once; the draft is kept)
  if (!force && !p.hold && document.activeElement && document.activeElement.id === 'notes') return;
  detailSig = sig;
  stopBlink();
  var card = el('article', { class: 'card detail', 'data-id': p.id, 'data-anchor': /^PR-\d{1,6}$/.test(p.id) ? p.id : null, 'data-anchor-label': p.title });
  var hb = holdBanner(p), sb = staleBanner(p);
  if (hb) card.appendChild(hb);
  if (sb) card.appendChild(sb);
  card.appendChild(el('div', { class: 'meta' },
    p.hold ? el('span', { class: 'chip held', text: 'On hold' }) : el('span', { class: 'chip ' + (p.state === 'proposed' ? 'waiting' : p.state), text: p.decisionState === 'stale' ? 'decide again' : (STATE_TEXT[p.state] || p.state) }),
    el('span', { text: p.id + ' · ' + (AREA_TEXT[p.area] || p.area) + ' · by ' + p.by + ' · revision ' + p.rev + ' · ' + when(p.proposedAt || p.createdAt) }),
    p.topic ? el('span', { class: 'chip muted', text: p.topic }) : null,
    p.thread && /^T-\d{1,6}$/.test(p.thread) ? el('a', { href: '/threads#' + p.thread, text: 'thread ' + p.thread }) : null));
  card.appendChild(el('h2', { class: 'title', text: p.title }));
  var revs = p.revisions || [];
  if (revs.length > 1) card.appendChild(el('p', { class: 'hint', text: 'Revision ' + p.rev + ': ' + revs[revs.length - 1].note }));
  card.appendChild(section('What costs', para(p.problem)));
  if (p.options && p.options.length) {
    // I-053: the shared text (if any), then the options
    if (p.idea) card.appendChild(section('The idea', para(p.idea)));
    if (p.looksSame) card.appendChild(section('Why it looks the same', para(p.looksSame)));
    if (p.risk) card.appendChild(section('Risk', para(p.risk)));
    card.appendChild(optionsBlock(p));
  } else {
    card.appendChild(section('The idea', para(p.idea)));
    card.appendChild(section('Why it looks the same', para(p.looksSame)));
    var ul = el('ul');
    (p.visualDiff || []).forEach(function (t) { ul.appendChild(el('li', { text: t })); });
    card.appendChild(section('What looks different, and when you would notice', [ul]));
    if (p.gain && p.gain.length) card.appendChild(section('What it saves', [gainTable(p.gain)]));
    card.appendChild(section('Risk', para(p.risk)));
    card.appendChild(compareBlock(p));
  }
  // I-074: the decision and history go below the "Try it" panel, which keeps its own container so the framed
  // pages are not reloaded each time the proposal is redrawn
  var dec = el('div', { class: 'decide' }, decisionBlock(p));
  var hist = el('details', { class: 'hist' }, el('summary', { text: 'History' }));
  var hl = el('ul');
  revs.forEach(function (r) { hl.appendChild(el('li', { text: when(r.at) + ' revision ' + r.rev + ' by ' + r.by + ': ' + r.note })); });
  (p.decisions || []).forEach(function (d) { hl.appendChild(el('li', { text: when(d.at) + ' ' + (STATE_TEXT[d.value] || d.value) + (d.option ? ', option ' + optLabel(p, d.option) : '') + ' (revision ' + d.rev + ')' + (d.staleOnRev ? ' (stale since revision ' + d.staleOnRev + ')' : '') + (d.notes ? ': ' + d.notes : '') })); });
  hist.appendChild(hl);
  dec.appendChild(hist);
  box.replaceChildren(card);
  renderTryIt(p);
  document.getElementById('decide').replaceChildren(dec);
}

// ---- loading ----
function setUpd(text, off) { var u = document.getElementById('upd'); u.textContent = text; u.className = 'sub' + (off ? ' status off' : ''); }
function load() {
  return fetch('/api/proposals', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
    var items = v.proposals || [];
    var s = JSON.stringify(items) + '|' + currentId();
    if (s !== listSig) { listSig = s; renderList(items); }
    var waiting = items.filter(function (p) { return p.state === 'proposed' && !p.hold; }).length;
    setUpd(waiting ? waiting + ' waiting for you · live' : 'nothing waiting · live');
    var id = currentId();
    if (!id) { current = null; renderDetail(null); return; }
    return fetch('/api/proposals/' + id, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      current = j && j.proposal; renderDetail(current);
      if (!current) document.getElementById('detail').replaceChildren(el('p', { class: 'empty', text: id + ' is not here (withdrawn, or not posted yet).' }));
    });
  }).catch(function () { setUpd('not connected: is console.mjs serve running?', true); });
}
window.addEventListener('hashchange', function () { detailSig = ''; listSig = ''; load().then(function () { var d = document.getElementById('detail'); if (d && d.firstChild && d.scrollIntoView) d.scrollIntoView({ block: 'start' }); }); });
if (window.ConsoleNav) ConsoleNav.onChange = function () { load(); }; // a proposal came or went
load().then(function () {
  // no proposal chosen: open the oldest waiting one
  if (!currentId()) { var first = document.querySelector('#list a.row'); if (first && /waiting/.test(first.firstChild.className)) location.replace(first.getAttribute('href')); }
});
setInterval(load, 10000);
</script>
