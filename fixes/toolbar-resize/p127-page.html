<!doctype html>
<!-- toolbar-resize P-127 test page (count-only; no Fastwork code). Served from the overlay as /p127/index.html.
     One attribute write per round, from an IntersectionObserver callback (io), a requestAnimationFrame callback (raf)
     or a timer callback (timer). Each callback brackets its write with two performance.mark()s, so the reader can find
     the records the write raised by structure (siblings between the two TimeStamp records), not by time.
     spec = <cause>-<kind>-<attr> | <cause>-none; cause io|raf|timer; kind change|same; attr sel (data-sel, used by the
     rule .t[data-sel="b"]) | nosel (data-nosel, used by no selector). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P-127 write check</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #fff; }
  .t { width: 100px; height: 40px; margin: 8px; background: #ccc; }
  .t[data-sel="b"] { width: 120px; }
</style>
<div id="tsel" class="t" data-sel="a"></div>
<div id="tnosel" class="t" data-nosel="a"></div>
<div id="iotarget" class="t"></div>
<script>
  (() => {
    const tsel = document.getElementById('tsel'), tnosel = document.getElementById('tnosel'), iotarget = document.getElementById('iotarget');
    const parse = (spec) => { const [cause, kind, attr] = spec.split('-'); return { cause, kind, attr: attr || null }; };
    function p127write(s, i) {
      if (s.kind === 'none') return;
      const el = s.attr === 'sel' ? tsel : tnosel, name = s.attr === 'sel' ? 'data-sel' : 'data-nosel';
      el.setAttribute(name, s.kind === 'change' ? (i % 2 ? 'a' : 'b') : 'a');
    }
    function p127round(spec, s, i, done) {
      performance.mark(`p127:${spec}:${i}`);
      p127write(s, i);
      performance.mark(`p127end:${spec}:${i}`);
      done();
    }
    window.__p127 = {
      reset() { tsel.setAttribute('data-sel', 'a'); tnosel.setAttribute('data-nosel', 'a'); return 'reset'; },
      run(spec, rounds, gapMs) {
        const s = parse(spec);
        if (!['io', 'raf', 'timer'].includes(s.cause) || !['change', 'same', 'none'].includes(s.kind) || (s.kind !== 'none' && !['sel', 'nosel'].includes(s.attr))) return Promise.reject(new Error(`bad spec ${spec}`));
        let fired = 0;
        return new Promise((resolve) => {
          const done = () => { fired++; };
          const next = (i) => {
            if (i >= rounds) { setTimeout(() => resolve({ spec, rounds, fired }), 300); return; }
            if (s.cause === 'io') {
              const o = new IntersectionObserver(function p127io() { o.disconnect(); p127round(spec, s, i, done); });
              o.observe(iotarget);
            } else if (s.cause === 'raf') {
              requestAnimationFrame(function p127raf() { p127round(spec, s, i, done); });
            } else {
              setTimeout(function p127timer() { p127round(spec, s, i, done); }, 0);
            }
            setTimeout(() => next(i + 1), gapMs);
          };
          next(0);
        });
      },
    };
  })();
</script>
