<!doctype html>
<!-- P-100 (cd-roll-ca, F-212 display-rate diagnostic): one countdown-like digit, nothing else on the page. Mode from
  ?m= : quiet  = the digit never moves (no animation, no rAF, no timer after load);
        ca     = every 1 s a 1-step roll as V9 does it: Web Animations on the cells near the path, V9's keyframes
                 (__crPath of V9, 144 per cell), easing linear, fill both, cancelled at the end (onfinish);
        paused = one V9-style animation per near cell created once and paused at time 0, left on the layers (a paused
                 animation keeps its CA animation at speed 0 and its frame-rate request: arch-gpu-lessons, GraphicsLayerCA
                 l.1258-1272, PlatformCAAnimationRemote.mm l.583, l.609-612);
        raf    = every 1 s the same roll by the original's rAF spring (GE, literal copy), one inline transform write
                 per frame, until GE is done (C8-like).
  The strip/cell geometry and CSS follow cd-strip strip-tc (cells are layers, will-change: transform). No network,
  no inspector hooks, nothing personal. The script is p100.js (same origin): the mirror server's CSP for a
  document without a production policy is script-src 'self', which blocks inline scripts (rev 2). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p100</title>
<style>
  html, body { margin: 0; background: #fff; color: #111; font: 600 28px/1.3 -apple-system, system-ui, sans-serif; }
  .box { padding: 40vh 0 0; text-align: center; }
  .digit { width: 1ch; line-height: 1.3; display: inline-block; position: relative; overflow: hidden; }
  .spacer { visibility: hidden; display: block; }
  .strip { will-change: transform; display: block; position: absolute; inset: 0; }
  .wrap { display: block; position: absolute; top: 0; left: 0; right: 0; height: 100%; }
  .cell { will-change: transform; justify-content: center; align-items: center; display: flex; position: absolute;
    top: 0; left: 0; right: 0; height: 100%; font-variant-numeric: tabular-nums; }
</style>
<div class="box"><span class="digit"><span class="spacer">0</span><span class="strip"><span class="wrap" id="w"></span></span></span></div>
<script src="p100.js"></script>
